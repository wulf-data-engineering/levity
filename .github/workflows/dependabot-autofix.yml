name: Antigravity Dependabot Auto-Fix

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Dependabot PR number to auto-fix"
        required: true
        type: string
      ci_run_id:
        description: "Failed CI workflow run ID (optional; auto-detected if omitted)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  fix-dependabot:
    name: Fix Dependabot Breaking Changes
    # Strictly run only for dependabot PRs on the origin repository
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.actor.login == 'dependabot[bot]' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_REPO_OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GA_GEMINI_MODEL: ${{ vars.GA_GEMINI_MODEL || 'gemini-3.8-flash' }}

    steps:
      - name: Resolve Target PR and CI Run
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_CI_RUN_ID: ${{ inputs.ci_run_id }}
          WORKFLOW_RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
            CI_RUN_ID="$INPUT_CI_RUN_ID"
          else
            # workflow_run
            PR_NUMBER="$WORKFLOW_RUN_PR_NUMBER"
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
              PR_NUMBER=$(gh pr list -R "$GH_REPO" --head "$WORKFLOW_RUN_HEAD_BRANCH" --json number -q '.[0].number')
            fi
            CI_RUN_ID="$WORKFLOW_RUN_ID"
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "Error: Could not resolve PR number."
            exit 1
          fi

          echo "Target PR: #$PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          PR_DATA=$(gh pr view "$PR_NUMBER" -R "$GH_REPO" --json author,headRefName,headRepositoryOwner,isCrossRepository)
          PR_AUTHOR=$(echo "$PR_DATA" | jq -r '.author.login')
          HEAD_BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')
          HEAD_REPO_OWNER=$(echo "$PR_DATA" | jq -r '.headRepositoryOwner.login')
          IS_CROSS_REPO=$(echo "$PR_DATA" | jq -r '.isCrossRepository')

          echo "PR Author: $PR_AUTHOR"
          echo "Head branch: $HEAD_BRANCH"
          echo "Head repository owner: $HEAD_REPO_OWNER"
          echo "Cross-repository: $IS_CROSS_REPO"

          # Security guard: only operate on dependabot[bot] PRs within the base repository
          if [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
            echo "Security guard: PR #$PR_NUMBER is authored by '$PR_AUTHOR', not 'dependabot[bot]'. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$IS_CROSS_REPO" = "true" ] || [ "$HEAD_REPO_OWNER" != "$GH_REPO_OWNER" ]; then
            echo "Security guard: PR #$PR_NUMBER originates from an external fork. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ ! "$HEAD_BRANCH" =~ ^dependabot/ ]]; then
            echo "Security guard: Branch '$HEAD_BRANCH' does not start with 'dependabot/'. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "skip=false" >> $GITHUB_OUTPUT
          echo "head_branch=$HEAD_BRANCH" >> $GITHUB_OUTPUT
          echo "head_repo=$HEAD_REPO_OWNER" >> $GITHUB_OUTPUT

          if [ -z "$CI_RUN_ID" ] || [ "$CI_RUN_ID" = "null" ]; then
            CI_RUN_ID=$(gh run list -R "$GH_REPO" --workflow "Continuous Integration" --branch "$HEAD_BRANCH" --status failure --limit 1 --json databaseId -q '.[0].databaseId' || true)
            echo "Auto-detected latest failed CI run ID: $CI_RUN_ID"
          fi

          echo "ci_run_id=$CI_RUN_ID" >> $GITHUB_OUTPUT

      - name: Checkout PR branch
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.resolve.outputs.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git hooks
        if: steps.resolve.outputs.skip != 'true'
        run: |
          if [ ! -d .githooks ]; then
            git checkout origin/main -- .githooks 2>/dev/null || true
          fi
          chmod +x .githooks/* 2>/dev/null || true
          git config core.hooksPath .githooks

      - name: Ensure CI scripts and rules available
        if: steps.resolve.outputs.skip != 'true'
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          HAD_CALCULATE_COST=false
          HAD_FILTER_SCRIPT=false
          HAD_DEPENDABOT_RULE=false
          if [ -f .github/scripts/calculate_cost.py ]; then
            HAD_CALCULATE_COST=true
          fi
          if [ -f .github/scripts/filter_ci_log.py ]; then
            HAD_FILTER_SCRIPT=true
          fi
          if [ -f .agent/rules/dependabot-autofix.md ]; then
            HAD_DEPENDABOT_RULE=true
          fi

          echo "had_calculate_cost=$HAD_CALCULATE_COST" >> $GITHUB_ENV
          echo "had_filter_script=$HAD_FILTER_SCRIPT" >> $GITHUB_ENV
          echo "had_dependabot_rule=$HAD_DEPENDABOT_RULE" >> $GITHUB_ENV

          git fetch origin "$GITHUB_SHA" 2>/dev/null || git fetch origin "$GITHUB_REF" 2>/dev/null || true

          if [ "$HAD_CALCULATE_COST" = "false" ]; then
            mkdir -p .github/scripts
            git show "$GITHUB_SHA:.github/scripts/calculate_cost.py" > .github/scripts/calculate_cost.py 2>/dev/null || \
              git show origin/main:.github/scripts/calculate_cost.py > .github/scripts/calculate_cost.py 2>/dev/null || true
          fi

          if [ "$HAD_FILTER_SCRIPT" = "false" ]; then
            mkdir -p .github/scripts
            git show "$GITHUB_SHA:.github/scripts/filter_ci_log.py" > .github/scripts/filter_ci_log.py 2>/dev/null || \
              git show origin/main:.github/scripts/filter_ci_log.py > .github/scripts/filter_ci_log.py 2>/dev/null || true
          fi

          if [ "$HAD_DEPENDABOT_RULE" = "false" ]; then
            mkdir -p .agent/rules
            git show "$GITHUB_SHA:.agent/rules/dependabot-autofix.md" > .agent/rules/dependabot-autofix.md 2>/dev/null || \
              git show origin/main:.agent/rules/dependabot-autofix.md > .agent/rules/dependabot-autofix.md 2>/dev/null || true
          fi

      - name: Check latest commit author
        if: steps.resolve.outputs.skip != 'true'
        id: check_author
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          LATEST_AUTHOR=$(git log -1 --pretty=format:'%an')
          echo "Latest commit author: $LATEST_AUTHOR"
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$LATEST_AUTHOR" = "github-actions[bot]" ]; then
            echo "Latest commit was already made by github-actions[bot]. Skipping to prevent loop."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect modified subproject
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true'
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          echo "Changed files in PR:"
          echo "$CHANGED_FILES"

          HAS_FRONTEND=false
          HAS_INFRA=false
          HAS_BACKEND=false

          if echo "$CHANGED_FILES" | grep -q -E '(^template/.*/frontend/|^frontend/)'; then
            HAS_FRONTEND=true
          fi
          if echo "$CHANGED_FILES" | grep -q -E '(^template/.*/infrastructure/|^infrastructure/)'; then
            HAS_INFRA=true
          fi
          if echo "$CHANGED_FILES" | grep -q -E '(^template/.*/backend/|^backend/|^tools/)'; then
            HAS_BACKEND=true
          fi

          echo "has_frontend=$HAS_FRONTEND" >> $GITHUB_OUTPUT
          echo "has_infra=$HAS_INFRA" >> $GITHUB_OUTPUT
          echo "has_backend=$HAS_BACKEND" >> $GITHUB_OUTPUT

      - name: Install cookiecutter
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true'
        run: pip install cookiecutter

      - name: Generate initial test instance
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true'
        run: cookiecutter --no-input --output-dir . template/ project_slug="test-instance"

      - name: Set up Node.js
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true' && (steps.detect.outputs.has_frontend == 'true' || steps.detect.outputs.has_infra == 'true')
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Restore frontend cache
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true' && steps.detect.outputs.has_frontend == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.npm
            test-instance/frontend/node_modules/
          key: node-modules-cache-${{ hashFiles('template/@@cookiecutter.project_slug@@/frontend/package-lock.json') }}
          restore-keys: node-modules-cache-

      - name: Install Protoc
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true' && (steps.detect.outputs.has_frontend == 'true' || steps.detect.outputs.has_backend == 'true')
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Install frontend dependencies
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true' && steps.detect.outputs.has_frontend == 'true'
        working-directory: test-instance/frontend
        run: |
          npm ci
          npm run gen:proto

      - name: Install infrastructure dependencies
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true' && steps.detect.outputs.has_infra == 'true'
        working-directory: test-instance/infrastructure
        run: npm ci

      - name: Set up Rust cache
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true' && steps.detect.outputs.has_backend == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: backend-ci
          workspaces: ./test-instance/backend -> target
          save-if: false

      - name: Install cargo-nextest
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true' && steps.detect.outputs.has_backend == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install Antigravity CLI
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true'
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          mkdir -p ~/.gemini/antigravity-cli
          echo "{\"modelProvider\": \"gemini\", \"model\": \"${GA_GEMINI_MODEL:-gemini-3.8-flash}\"}" > ~/.gemini/antigravity-cli/settings.json

      - name: Fetch and filter failed CI logs
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ steps.resolve.outputs.ci_run_id }}
        run: |
          if [ -n "$CI_RUN_ID" ] && [ "$CI_RUN_ID" != "null" ]; then
            echo "Fetching failed logs for CI run $CI_RUN_ID..."
            gh run view "$CI_RUN_ID" --log-failed > raw_failure.log
            python3 .github/scripts/filter_ci_log.py raw_failure.log ci_failure.log
            rm -f raw_failure.log
            echo "Filtered log size: $(wc -l < ci_failure.log) lines ($(wc -c < ci_failure.log) bytes)"
          else
            echo "No CI run ID available to fetch logs from." > ci_failure.log
          fi

      - name: Execute Antigravity Agent
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true'
        id: run_agy
        run: |
          set +e
          agy -p "You are running headless in direct execution mode on the Levity template repository. Do not create an implementation plan or wait for approval. Follow all instructions in @.agent/rules/dependabot-autofix.md. Analyze 'ci_failure.log' to understand what broke in this Dependabot update, immediately apply minimal fixes to code, types, or configs in 'template/@@cookiecutter.project_slug@@/', verify using the allowed lightweight checks in 'test-instance/', and write a concise bullet-point summary of your fixes to 'summary.txt'. Preserve custom Jinja delimiters (@@ ... @@) when editing template files. Do not spawn subagents or background tasks." \
            --model "${GA_GEMINI_MODEL:-gemini-3.8-flash}" \
            --dangerously-skip-permissions \
            --output-format json \
            --effort low \
            --print-timeout 5m > /tmp/agy_output.json
          AGY_EXIT=$?
          set -e

          INPUT_TOKENS=$(jq -r '.usage.input_tokens // empty' /tmp/agy_output.json 2>/dev/null || true)
          OUTPUT_TOKENS=$(jq -r '.usage.output_tokens // empty' /tmp/agy_output.json 2>/dev/null || true)
          TOTAL_TOKENS=$(jq -r '.usage.total_tokens // empty' /tmp/agy_output.json 2>/dev/null || true)

          echo "AGY_EXIT=$AGY_EXIT" >> $GITHUB_ENV
          echo "agy_exit=$AGY_EXIT" >> $GITHUB_OUTPUT
          echo "input_tokens=$INPUT_TOKENS" >> $GITHUB_OUTPUT
          echo "output_tokens=$OUTPUT_TOKENS" >> $GITHUB_OUTPUT
          echo "total_tokens=$TOTAL_TOKENS" >> $GITHUB_OUTPUT

          echo "Agent exit code: $AGY_EXIT"
          echo "Agent token usage: $INPUT_TOKENS in / $OUTPUT_TOKENS out ($TOTAL_TOKENS total)"

          if [ -f /tmp/agy_output.json ]; then
            echo "--- Agent Final Output ---"
            jq -r '.messages[-1].content // .response // empty' /tmp/agy_output.json 2>/dev/null || true
            echo "---------------------------"
          fi

          if [ -n "$INPUT_TOKENS" ] && [ -n "$OUTPUT_TOKENS" ] && [ "$INPUT_TOKENS" != "null" ]; then
            export INPUT_TOKENS OUTPUT_TOKENS MODEL="${GA_GEMINI_MODEL:-gemini-3.8-flash}"
            python3 .github/scripts/calculate_cost.py
          fi

      - name: Commit and push changes
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true'
        id: commit_push
        env:
          HEAD_BRANCH: ${{ steps.resolve.outputs.head_branch }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clean up test-instance if generated
          rm -rf test-instance
          
          # Clean up temporarily injected files if they weren't in PR branch originally
          if [ "$had_calculate_cost" = "false" ]; then
            rm -f .github/scripts/calculate_cost.py
          fi
          if [ "$had_filter_script" = "false" ]; then
            rm -f .github/scripts/filter_ci_log.py
          fi
          if [ "$had_calculate_cost" = "false" ] && [ "$had_filter_script" = "false" ]; then
            rmdir .github/scripts 2>/dev/null || true
          else
            git checkout -- .github/scripts 2>/dev/null || true
          fi

          if [ "$had_dependabot_rule" = "false" ]; then
            rm -f .agent/rules/dependabot-autofix.md
          else
            git checkout -- .agent/rules/dependabot-autofix.md 2>/dev/null || true
          fi

          # Ensure no accidental modifications to other rules
          git checkout -- .agent/rules 2>/dev/null || true

          CHANGES=$(git status --porcelain | grep -v -E '(summary\.txt|ci_failure\.log|raw_failure\.log|test-instance)' || true)

          if [ -n "$CHANGES" ]; then
            git add .
            git reset summary.txt ci_failure.log raw_failure.log test-instance 2>/dev/null || true

            if [ -f summary.txt ]; then
              {
                echo "fix(deps): resolve breaking changes via Antigravity Agent"
                echo ""
                cat summary.txt
              } > full_commit_msg.txt
              git commit -F full_commit_msg.txt
              rm -f full_commit_msg.txt
            else
              git commit -m "fix(deps): resolve breaking changes via Antigravity Agent"
            fi

            git push origin "$HEAD_BRANCH" --no-verify
            echo "fix_applied=true" >> $GITHUB_OUTPUT
          else
            echo "No changes were applied by the agent."
            echo "fix_applied=false" >> $GITHUB_OUTPUT
          fi

      - name: Post PR comment & cost label
        if: steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true' && (steps.commit_push.outputs.fix_applied == 'true' || steps.commit_push.outputs.fix_applied == 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          FIX_APPLIED: ${{ steps.commit_push.outputs.fix_applied }}
          INPUT_TOKENS: ${{ steps.run_agy.outputs.input_tokens }}
          OUTPUT_TOKENS: ${{ steps.run_agy.outputs.output_tokens }}
          TOTAL_TOKENS: ${{ steps.run_agy.outputs.total_tokens }}
          COST_STATUS: ${{ steps.run_agy.outputs.cost_status }}
          COST_LABEL: ${{ steps.run_agy.outputs.cost_label }}
          COST_ERROR: ${{ steps.run_agy.outputs.cost_error }}
          EST_COST: ${{ steps.run_agy.outputs.est_cost }}
        run: |
          # Apply cost label on PR
          if [ -n "$COST_LABEL" ] && [ "$COST_LABEL" != "null" ]; then
            # Remove previous cost or token labels to avoid clutter
            OLD_LABELS=$(gh pr view "$PR_NUMBER" --json labels -q '.labels[].name | select(startswith("cost:") or startswith("tokens") or startswith("~$") or startswith("<$") or . == "cost calculation failed")' || true)
            for L in $OLD_LABELS; do
              gh pr edit "$PR_NUMBER" --remove-label "$L" || true
            done

            if [ "$COST_STATUS" = "failed" ]; then
              gh label create "cost calculation failed" --color "d73a4a" --description "Antigravity cost calculation failed" --force || true
              gh pr edit "$PR_NUMBER" --add-label "cost calculation failed" || true
              FAIL_MSG="⚠️ **Antigravity Cost Calculation Failed**"$'\n\n'"Could not calculate running cost for model \`${GA_GEMINI_MODEL:-gemini-3.8-flash}\`: $COST_ERROR"$'\n\n'"> 📊 **Usage**: $INPUT_TOKENS in / $OUTPUT_TOKENS out ($TOTAL_TOKENS total tokens)"
              gh pr comment "$PR_NUMBER" --body "$FAIL_MSG" || true
            else
              gh label create "$COST_LABEL" --color "0E8A16" --description "Estimated Antigravity agent cost" --force || true
              gh pr edit "$PR_NUMBER" --add-label "$COST_LABEL" || true
            fi
          fi

          TOKEN_FOOTER=""
          if [ -n "$INPUT_TOKENS" ] && [ -n "$OUTPUT_TOKENS" ] && [ "$INPUT_TOKENS" != "null" ]; then
            TOKEN_FOOTER="---"$'\n'"> 📊 **Antigravity Consumption** (${GA_GEMINI_MODEL:-gemini-3.8-flash}): $INPUT_TOKENS in / $OUTPUT_TOKENS out ($TOTAL_TOKENS total) · Est. cost: $EST_COST"
          fi

          if [ "$FIX_APPLIED" = "true" ]; then
            if [ -f summary.txt ]; then
              {
                echo "### 🤖 Antigravity Dependabot Auto-Fix Applied"
                echo ""
                cat summary.txt
                echo ""
                echo "> [!NOTE]"
                echo "> Fixes have been committed to this branch. Please re-run CI checks to verify."
                if [ -n "$TOKEN_FOOTER" ]; then
                  echo ""
                  echo "$TOKEN_FOOTER"
                fi
              } > pr_comment.txt
            else
              {
                echo "### 🤖 Antigravity Dependabot Auto-Fix Applied"
                echo ""
                echo "Antigravity made automated adjustments to resolve breaking changes in this pull request. Please re-run CI checks to verify."
                if [ -n "$TOKEN_FOOTER" ]; then
                  echo ""
                  echo "$TOKEN_FOOTER"
                fi
              } > pr_comment.txt
            fi
          else
            {
              echo "### 🤖 Antigravity Dependabot Auto-Fix Attempted"
              echo ""
              echo "Antigravity inspected the CI failure logs but was unable to automatically resolve the breaking changes. Human review is required."
              if [ -n "$TOKEN_FOOTER" ]; then
                echo ""
                echo "$TOKEN_FOOTER"
              fi
            } > pr_comment.txt
          fi

          gh pr comment "$PR_NUMBER" --body-file pr_comment.txt
          rm -f pr_comment.txt

      - name: Upload debug artifacts
        if: always() && steps.resolve.outputs.skip != 'true' && steps.check_author.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: antigravity-autofix-debug
          path: |
            ci_failure.log
            /tmp/agy_output.json
            summary.txt
            /home/runner/.gemini/antigravity-cli/brain/**
            /home/runner/.gemini/antigravity-cli/log/**
          if-no-files-found: ignore
          retention-days: 3

