name: Sequential Dependabot Dispatcher

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dependabot-dispatcher
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  dispatch:
    name: Dispatch Next Dependabot PR
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate GitHub App Token
        id: app-token
        if: env.HAS_APP_ID == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        env:
          HAS_APP_ID: ${{ secrets.APP_ID != '' }}

      - name: Run Sequential Dependabot Dispatcher
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/dispatch_dependabot.py
