[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[profile.dev]
debug = "line-tables-only" # Keep file:line in backtraces, drop heavy variable/type DWARF data
strip = "none" # Keep symbol names and line tables intact

[profile.dev.package."*"]
opt-level = "s" # Optimize 3rd-party dependencies for size (compiled once and cached)
debug = false # Strip all debug info from dependencies

[profile.release]
codegen-units = 1 # Reduce binary size by compiling all code in one unit
lto = "fat" # Enable best link-time optimization to reduce binary size
strip = "debuginfo"

[profile.sandbox]
inherits = "release"
codegen-units = 16
lto = "none"
opt-level = 1 # bit of optimization
strip = "symbols" # smaller binary

[dependencies]
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["macros"] }
lambda_runtime = "1.5.0"
lambda_http = "1.3.2"
tracing-subscriber = "0.3.23"
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
prost = "0.14.4"
snap = "1.1.2"
aws-config = { version = "1.13.0", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"] }
aws-credential-types = "1.3.1"
aws_lambda_events = { version = "1.2.1", default-features = false, features = ["sqs", "cognito", "apigw", "catch-all-fields"] }
aws-sdk-cognitoidentityprovider = { version = "1.143.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1.135.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1.132.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ses = { version = "1.122.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
schemars = "1.2.3"
chrono = { version = "0.4.45", features = ["serde"] }
wiremock = "0.6.5"
base64 = "0.23.1"
once_cell = "1.21.4"
rust-i18n = "4.2.4"

[dev-dependencies]
expectorate = "1.3.0"

[build-dependencies]
prost-build = "0.14.4"
prost-types = "0.14.4"
prost = "0.14.4"

[[bin]]
name = "password-policy"
path = "src/password-policy.rs"

[[bin]]
name = "cognito-handler"
path = "src/cognito-handler.rs"

[[bin]]
name = "message-handler"
path = "src/message-handler.rs"

[[bin]]
name = "user-profile"
path = "src/user-profile.rs"
