[package]
name = "websocket-mock"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
uuid = { version = "1.29.0", features = ["v4"] }
futures-util = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0.104"
base64 = "0.23.1"
tower-http = { version = "0.7.1", features = ["trace"] }
